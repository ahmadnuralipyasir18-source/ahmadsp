<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Cepat 📱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    h1 {
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      color: #a0aec0;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      color: #e2e8f0;
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #e94560;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.2);
    }

    input::placeholder {
      color: #718096;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #e94560, #ff6b6b);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 10px 20px -5px rgba(233, 69, 96, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(233, 69, 96, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Overlay DUAR */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      overflow: hidden;
    }

    #overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .duar-text {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 900;
      color: #ff2d55;
      text-shadow: 
        0 0 20px #ff2d55,
        0 0 40px #ff2d55,
        0 0 80px #ff2d55;
      animation: boom 0.6s cubic-bezier(0.17, 0.67, 0.3, 1.33) forwards;
      letter-spacing: 4px;
      z-index: 2;
    }

    .jomblo-text {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      color: #fff;
      margin-top: 20px;
      opacity: 0;
      animation: slideUp 0.5s ease 0.4s forwards;
      font-weight: 700;
      z-index: 2;
    }

    .yahaha {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #ffcc00;
      margin-top: 12px;
      opacity: 0;
      animation: slideUp 0.5s ease 0.7s forwards;
      z-index: 2;
    }

    /* Particles / explosion effect */
    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff2d55;
      border-radius: 50%;
      animation: explode 1.2s ease-out forwards;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes boom {
      0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
      50% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes explode {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    .success-msg {
      display: none;
      color: #68d391;
      margin-top: 20px;
      font-weight: 600;
      font-size: 1rem;
    }

    .footer {
      margin-top: 24px;
      color: #718096;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Form Cepat</h1>
    <p class="subtitle">Isi data biar gampang dihubungi ya\~</p>

    <form id="mainForm" action="https://formsubmit.co/ahmadnuralipyasir@gmail.com" method="POST">
      <div class="form-group">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Nama kamu..." required>
      </div>

      <div class="form-group">
        <label for="nomor">Nomor HP / WA</label>
        <input type="tel" id="nomor" name="nomor" placeholder="08xxxxxxxxxx" required>
      </div>

      <!-- Setting FormSubmit -->
      <input type="hidden" name="_subject" value="🔥 Data baru dari Web Jomblo">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <button type="submit" id="submitBtn">Kirim Sekarang</button>
    </form>

    <p class="success-msg" id="successMsg">✅ Data berhasil dikirim!</p>
    <p class="footer">Jangan lupa isi yang bener ya 😉</p>
  </div>

  <!-- Overlay DUAR -->
  <div id="overlay">
    <div class="duar-text">DUAR!</div>
    <div class="jomblo-text">Yahahaha Jomblo 😂</div>
    <div class="yahaha">Selamat, kamu masih jomblo!</div>
  </div>

  <!-- Audio DUAR -->
  <audio id="duarSound" preload="auto">
    <source src="https://www.myinstants.com/media/sounds/duar.mp3" type="audio/mpeg">
  </audio>

  <script>
    const form = document.getElementById('mainForm');
    const overlay = document.getElementById('overlay');
    const sound = document.getElementById('duarSound');
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault(); // Stop dulu biar animasi jalan

      // Disable button
      submitBtn.disabled = true;
      submitBtn.textContent = 'Mengirim...';

      // Play suara DUAR
      sound.currentTime = 0;
      sound.play().catch(err => console.log('Audio play failed:', err));

      // Tampilkan overlay
      overlay.classList.add('active');

      // Buat partikel ledakan
      createParticles();

      // Kirim data secara diam-diam (tanpa pindah halaman)
      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      })
      .then(response => {
        if (response.ok) {
          // Berhasil → tunggu animasi selesai baru hilangkan overlay
          setTimeout(() => {
            overlay.classList.remove('active');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Kirim Sekarang';
            successMsg.style.display = 'block';
            form.reset();
          }, 3500);
        } else {
          // Gagal
          setTimeout(() => {
            overlay.classList.remove('active');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Kirim Sekarang';
            alert('Gagal mengirim data. Coba lagi ya.');
          }, 2000);
        }
      })
      .catch(error => {
        console.log('Error:', error);
        setTimeout(() => {
          overlay.classList.remove('active');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Kirim Sekarang';
          alert('Terjadi kesalahan. Coba lagi.');
        }, 2000);
      });
    });

    function createParticles() {
      const colors = ['#ff2d55', '#ffcc00', '#ff6b6b', '#ffffff', '#e94560'];
      
      for (let i = 0; i < 40; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 250;
        const tx = Math.cos(angle) * distance + 'px';
        const ty = Math.sin(angle) * distance + 'px';
        
        particle.style.setProperty('--tx', tx);
        particle.style.setProperty('--ty', ty);
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        particle.style.left = '50%';
        particle.style.top = '50%';
        particle.style.width = (6 + Math.random() * 12) + 'px';
        particle.style.height = particle.style.width;
        
        overlay.appendChild(particle);
        
        // Hapus partikel setelah animasi
        setTimeout(() => particle.remove(), 1300);
      }
    }
  </script>
</body>
</html>
